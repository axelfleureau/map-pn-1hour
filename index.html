<!DOCTYPE html>  
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa combinata 1 ora auto — Pordenone + San Donà di Piave</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html, body, #map { height: 100%; margin: 0; font-family: Arial, Helvetica, sans-serif; }

    .legend {
      background: rgba(255,255,255,0.94);
      padding: 14px 16px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      line-height: 1.35;
      max-width: 390px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .legend h3 { margin: 0 0 8px; font-size: 16px; }
    .legend-row { margin: 3px 0; }
    .badge {
      display:inline-block;
      width:12px;
      height:12px;
      border-radius:50%;
      margin-right:6px;
      vertical-align:-1px;
    }
    .swatch {
      display:inline-block;
      width:18px;
      height:11px;
      border-radius:3px;
      margin-right:6px;
      vertical-align:-1px;
      border:1px solid rgba(0,0,0,.25);
    }

    .pordenone { background:#ff0092; }
    .sandona { background:#00a8ff; }
    .overlap { background:linear-gradient(45deg,#ff0092 0 35%,#7b2cff 35% 65%,#00a8ff 65% 100%); }
    .center-pn { background:#ff0092; }
    .center-sd { background:#00a8ff; }
    .inside { background:#2ecc71; }
    .edge { background:#f39c12; }
    .outside { background:#e74c3c; }

    .note { color:#333; font-size:12px; margin-top:8px; }
    .leaflet-popup-content { font-size: 13px; }

    .legend-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (max-width: 700px) {
      .legend { max-width: 300px; font-size: 12px; padding: 12px; }
      .legend h3 { font-size: 14px; }
    }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const pordenoneCenter = [45.95689, 12.66051];
  const sanDonaCenter = [45.63488, 12.57211];

  const map = L.map('map', {
    center: [45.80, 12.68],
    zoom: 9,
    scrollWheelZoom: true
  });

  const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
      attribution: 'Tiles © Esri — Mappa indicativa Righello',
      maxZoom: 18
    }
  ).addTo(map);

  const labels = L.tileLayer(
    'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    {
      attribution: 'Labels © Esri',
      maxZoom: 18,
      pane: 'overlayPane'
    }
  ).addTo(map);

  const pordenone60 = [
    [45.600, 12.170],
    [45.650, 12.050],
    [45.780, 12.030],
    [45.930, 12.030],
    [46.080, 12.120],
    [46.270, 12.270],
    [46.350, 12.560],
    [46.330, 12.850],
    [46.210, 13.100],
    [46.080, 13.300],
    [45.930, 13.250],
    [45.760, 13.130],
    [45.620, 13.080],
    [45.550, 12.900],
    [45.500, 12.600],
    [45.600, 12.170]
  ];

  const sanDona60 = [
    [45.385, 12.250],
    [45.425, 12.110],
    [45.545, 12.020],
    [45.690, 12.020],
    [45.835, 12.160],
    [45.940, 12.300],
    [45.930, 12.620],
    [45.900, 12.900],
    [45.790, 13.120],
    [45.630, 13.100],
    [45.530, 12.970],
    [45.430, 12.650],
    [45.385, 12.250]
  ];

  const overlapApprox = [
    [45.500, 12.600],
    [45.550, 12.900],
    [45.620, 13.080],
    [45.760, 13.130],
    [45.900, 12.900],
    [45.930, 12.620],
    [45.940, 12.300],
    [45.780, 12.030],
    [45.650, 12.050],
    [45.600, 12.170],
    [45.500, 12.600]
  ];

  const pordenonePolygon = L.polygon(pordenone60, {
    color: '#ff0092',
    weight: 3,
    opacity: 0.95,
    fillColor: '#ff0092',
    fillOpacity: 0.20,
    dashArray: '8, 7'
  }).addTo(map).bindPopup('<b>Area Pordenone 33170</b><br>Copertura indicativa fino a circa 1 ora in auto.');

  const sanDonaPolygon = L.polygon(sanDona60, {
    color: '#00a8ff',
    weight: 3,
    opacity: 0.95,
    fillColor: '#00a8ff',
    fillOpacity: 0.20,
    dashArray: '8, 7'
  }).addTo(map).bindPopup('<b>Area San Donà di Piave 30027</b><br>Copertura indicativa fino a circa 1 ora in auto.');

  const overlapPolygon = L.polygon(overlapApprox, {
    color: '#7b2cff',
    weight: 2,
    opacity: 0.95,
    fillColor: '#7b2cff',
    fillOpacity: 0.28,
    dashArray: '3, 6'
  }).addTo(map).bindPopup('<b>Zona sovrapposta indicativa</b><br>Area raggiungibile indicativamente entro 1 ora sia da Pordenone sia da San Donà di Piave.');

  L.marker(pordenoneCenter, {
    title: 'Pordenone 33170'
  }).addTo(map).bindPopup('<b>Centro mappa</b><br>Pordenone — CAP 33170');

  L.marker(sanDonaCenter, {
    title: 'San Donà di Piave 30027'
  }).addTo(map).bindPopup('<b>Centro mappa</b><br>San Donà di Piave — CAP 30027');

  const places = [
    ['Pordenone',45.95689,12.66051,'Centro area Pordenone', 'center-pn'],
    ['San Donà di Piave',45.63488,12.57211,'Centro area San Donà', 'center-sd'],
    ['Sacile',45.9545,12.5032,'Pordenone: ~20–25 min / San Donà: limite ~55–65 min', 'overlap'],
    ['Aviano',46.0706,12.5886,'Pordenone: ~20–25 min', 'inside'],
    ['Maniago',46.1706,12.7074,'Pordenone: ~30–40 min', 'inside'],
    ['Spilimbergo',46.1124,12.9061,'Pordenone: ~30–40 min', 'inside'],
    ['San Vito al Tagliamento',45.9167,12.8550,'Pordenone: ~25–35 min / San Donà: ~50–60 min', 'overlap'],
    ['Casarsa della Delizia',45.9544,12.8428,'Pordenone: ~20–30 min / San Donà: limite', 'overlap'],
    ['Codroipo',45.9630,12.9797,'Pordenone: ~35–45 min', 'inside'],
    ['Udine',46.0711,13.2346,'Pordenone: ~50–60 min', 'edge'],
    ['Noventa di Piave',45.6601,12.5333,'San Donà: ~10 min', 'inside'],
    ['Musile di Piave',45.6200,12.5650,'San Donà: ~5–10 min', 'inside'],
    ['Jesolo',45.5331,12.6448,'San Donà: ~20–25 min / Pordenone: limite sud', 'overlap'],
    ['Caorle',45.5966,12.8758,'San Donà: ~35–45 min / Pordenone: ~50–60 min', 'overlap'],
    ['Bibione',45.6339,13.0520,'San Donà: ~55–65 min / Pordenone: ~55–65 min', 'overlap'],
    ['Lignano Sabbiadoro',45.6880,13.1397,'Zona limite per entrambe', 'overlap'],
    ['Mestre',45.4935,12.2463,'San Donà: ~40–55 min / Pordenone: spesso oltre 1 ora', 'edge'],
    ['Venezia / Piazzale Roma',45.4386,12.3185,'San Donà: limite ~55–70 min', 'edge'],
    ['Portogruaro',45.7750,12.8387,'Dentro entrambe: PN ~35–45 min / SD ~35–45 min', 'overlap'],
    ['Oderzo',45.7819,12.4933,'Dentro entrambe: PN ~35–45 min / SD ~30–40 min', 'overlap'],
    ['Conegliano',45.8870,12.3020,'Dentro entrambe o zona limite: PN ~35–45 min / SD ~50–60 min', 'overlap'],
    ['Treviso',45.6669,12.2430,'Dentro/limite per entrambe', 'overlap'],
    ['Vittorio Veneto',45.9790,12.3033,'Limite alto per entrambe', 'overlap'],
    ['Padova',45.4064,11.8768,'Oltre 1 ora da entrambe nella maggior parte dei casi', 'outside'],
    ['Trieste',45.6495,13.7768,'Oltre 1 ora da entrambe', 'outside'],
    ['Belluno',46.1425,12.2167,'Limite Pordenone / oltre San Donà', 'edge']
  ];

  const colors = {
    'center-pn': '#ff0092',
    'center-sd': '#00a8ff',
    inside: '#2ecc71',
    edge: '#f39c12',
    outside: '#e74c3c',
    overlap: '#7b2cff'
  };

  places.forEach(([name, lat, lng, time, type]) => {
    const marker = L.circleMarker([lat, lng], {
      radius: type === 'center-pn' || type === 'center-sd' ? 8 : 6,
      color: '#ffffff',
      weight: 2,
      fillColor: colors[type],
      fillOpacity: 1
    }).addTo(map);

    marker.bindPopup(`<b>${name}</b><br>${time}`);
  });

  const CombinedLegend = L.Control.extend({
    options: { position: 'bottomleft' },
    onAdd: function () {
      const wrapper = L.DomUtil.create('div', 'legend-stack');

      const div1 = L.DomUtil.create('div', 'legend', wrapper);
      div1.innerHTML = `
        <h3>Legenda aree 1 ora auto</h3>
        <div class="legend-row"><span class="swatch pordenone"></span><b>Pordenone 33170</b> — area indicativa entro ~1 ora</div>
        <div class="legend-row"><span class="swatch sandona"></span><b>San Donà di Piave 30027</b> — area indicativa entro ~1 ora</div>
        <div class="legend-row"><span class="swatch overlap"></span><b>Sovrapposizione</b> — zona raggiungibile da entrambe le origini</div>
        <div class="note">
          Le due aree sono volutamente colorate in modo diverso. Dove si incontrano, la zona viola/tratteggiata evidenzia l'area comune.
        </div>
      `;

      const div2 = L.DomUtil.create('div', 'legend', wrapper);
      div2.innerHTML = `
        <h3>Legenda punti</h3>
        <div class="legend-row"><span class="badge center-pn"></span>Centro Pordenone</div>
        <div class="legend-row"><span class="badge center-sd"></span>Centro San Donà di Piave</div>
        <div class="legend-row"><span class="badge overlap"></span>Città/zone nella sovrapposizione o molto utili a entrambe</div>
        <div class="legend-row"><span class="badge inside"></span>Zona interna principalmente a una delle due aree</div>
        <div class="legend-row"><span class="badge edge"></span>Zona limite: dipende da traffico/orario</div>
        <div class="legend-row"><span class="badge outside"></span>Spesso oltre 1 ora</div>
        <div class="note">
          La mappa non usa un raggio d'aria: è una stima operativa basata sulle principali direttrici stradali. Per campagne o logistica reale, i tempi vanno verificati su Google Maps/Mapbox in fascia oraria specifica.
        </div>
      `;

      return wrapper;
    }
  });

  map.addControl(new CombinedLegend());

  const allBounds = L.latLngBounds([...pordenone60, ...sanDona60]);
  map.fitBounds(allBounds, { padding: [30, 30] });
</script>
</body>
</html>
