  // Routing stradale reale/indicativo tramite OSRM.
  // Nota: tempi senza traffico live. Distanze in km di percorso stradale, non raggio d'aria.
  const routeCache = {};
  const routeOrigins = {
    pn: { name: 'Pordenone', lat: 45.95689, lng: 12.66051, color: '#ff0092' },
    sd: { name: 'San Donà di Piave', lat: 45.63488, lng: 12.57211, color: '#00a8ff' }
  };

  function formatDuration(minutes) {
    if (!Number.isFinite(minutes)) return 'n.d.';
    const h = Math.floor(minutes / 60);
    const m = Math.round(minutes % 60);
    if (h <= 0) return `${m} min`;
    return `${h} h ${m.toString().padStart(2, '0')} min`;
  }

  function routeKey(originKey, lat, lng) {
    return `${originKey}_${lat.toFixed(5)}_${lng.toFixed(5)}`;
  }

  async function getDrivingRoute(originKey, lat, lng) {
    const origin = routeOrigins[originKey];
    const key = routeKey(originKey, lat, lng);
    if (routeCache[key]) return routeCache[key];

    const url = `https://router.project-osrm.org/route/v1/driving/${origin.lng},${origin.lat};${lng},${lat}?overview=false&alternatives=false&steps=false`;
    const promise = fetch(url)
      .then(r => {
        if (!r.ok) throw new Error('Errore routing');
        return r.json();
      })
      .then(data => {
        if (!data.routes || !data.routes.length) throw new Error('Nessun percorso trovato');
        const route = data.routes[0];
        return {
          km: route.distance / 1000,
          min: route.duration / 60
        };
      });

    routeCache[key] = promise;
    return promise;
  }

  function buildPopupBase(name, text, level) {
    const zoomLabel = level === 1 ? 'base' : level === 2 ? '9+' : level === 3 ? '10+' : level === 4 ? '11+' : '12+';
    return `
      <b>${name}</b><br>
      ${text}<br>
      <small>Filtro: località con probabile campo/stadio da calcio. Visibile da zoom ${zoomLabel}</small>
      <div class="route-box" id="route-${slugify(name)}">
        <div class="route-title">Distanze stradali in auto</div>
        <div>Calcolo percorso stradale in corso…</div>
      </div>
      <div class="route-muted">Tempi stimati senza traffico live; km calcolati su strada, non in linea d'aria.</div>
    `;
  }

  function slugify(str) {
    return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
  }

  async function updateRoutePopup(marker, name, lat, lng, text, level) {
    marker.setPopupContent(buildPopupBase(name, text, level));

    const boxId = `route-${slugify(name)}`;

      const [pn, sd] = await Promise.all([
        getDrivingRoute('pn', lat, lng),
        getDrivingRoute('sd', lat, lng)

        <b>${name}</b><br>
        ${text}<br>
        <small>Filtro: località con probabile campo/stadio da calcio.</small>
        <div class="route-box">
          <div class="route-title">Distanze stradali in auto</div>
          <div><span style="color:${routeOrigins.pn.color};font-weight:700;">●</span> Da Pordenone: <b>${pn.km.toFixed(1)} km</b> · <b>${formatDuration(pn.min)}</b></div>
          <div><span style="color:${routeOrigins.sd.color};font-weight:700;">●</span> Da San Donà: <b>${sd.km.toFixed(1)} km</b> · <b>${formatDuration(sd.min)}</b></div>
        </div>
        <div class="route-muted">Dati calcolati su percorso stradale OSRM. Tempi indicativi senza traffico live.</div>
      `;
      marker.setPopupContent(content);
    } catch (err) {

        ${text}<br>
        <div class="route-box">
          <div class="route-title">Distanze stradali in auto</div>

        <div class="route-muted">Serve connessione internet perché il file HTML interroga un servizio di routing stradale.</div>
      `);
    }
  }

  const layersByLevel = {1: L.layerGroup(), 2: L.layerGroup(), 3: L.layerGroup(), 4: L.layerGroup(), 5: L.layerGroup()};

  function createCityMarker(name, lat, lng, text, type, level) {
    const marker = L.circleMarker([lat, lng], {
      radius: type === 'center-pn' || type === 'center-sd' ? 8 : (level <= 2 ? 6 : level === 3 ? 5 : 4),
      color: '#ffffff',
      weight: level >= 5 ? 1.5 : 2,
      fillColor: colors[type],
      fillOpacity: 1
    });

    marker.bindPopup(buildPopupBase(name, text, level));
    marker.on('click', () => updateRoutePopup(marker, name, lat, lng, text, level));

    const label = L.marker([lat, lng], {
      icon: L.divIcon({
        className: '',
        html: `<div class="city-label">${name}</div>`,
        iconSize: null,
        iconAnchor: [-10, 28]
      }),
      interactive: true
    });

    label.bindPopup(buildPopupBase(name, text, level));
    label.on('click', () => updateRoutePopup(label, name, lat, lng, text, level));

    layersByLevel[level].addLayer(L.layerGroup([marker, label]));
  }

  places.forEach(([name, lat, lng, text, type, level]) => createCityMarker(name, lat, lng, text, type, level));

  function updateZoomLayers() {
    const z = map.getZoom();
    Object.values(layersByLevel).forEach(layer => { if (map.hasLayer(layer)) map.removeLayer(layer); });
    layersByLevel[1].addTo(map);
    if (z >= 9) layersByLevel[2].addTo(map);
    if (z >= 10) layersByLevel[3].addTo(map);
    if (z >= 11) layersByLevel[4].addTo(map);
    if (z >= 12) layersByLevel[5].addTo(map);
    document.getElementById('zoomCounter').innerHTML = `Zoom ${z} · punti visibili: ${visibleCount(z)} / ${places.length}`;
  }

  function visibleCount(z) {
    return places.filter(p => p[5] === 1 || (z >= 9 && p[5] === 2) || (z >= 10 && p[5] === 3) || (z >= 11 && p[5] === 4) || (z >= 12 && p[5] === 5)).length;
  }

  map.on('zoomend', updateZoomLayers);

  const CombinedLegend = L.Control.extend({
    options: { position: 'bottomleft' },
    onAdd: function () {
      const wrapper = L.DomUtil.create('div', 'legend-stack');

      const button = L.DomUtil.create('button', 'legend-toggle', wrapper);
      button.type = 'button';
      button.innerHTML = '☰ Legenda';

      const content = L.DomUtil.create('div', 'legend-content', wrapper);

      const div1 = L.DomUtil.create('div', 'legend', content);
      div1.innerHTML = `
        <h3>Legenda aree 1 ora auto</h3>
        <div class="legend-row"><span class="swatch pordenone"></span><b>Pordenone 33170</b> — area indicativa entro ~1 ora</div>
        <div class="legend-row"><span class="swatch sandona"></span><b>San Donà di Piave 30027</b> — area indicativa entro ~1 ora</div>
        <div class="legend-row"><span class="swatch overlap"></span><b>Sovrapposizione</b> — zona raggiungibile da entrambe le origini</div>
        <div class="note">La zona viola/tratteggiata evidenzia la sovrapposizione stimata tra le due aree.</div>
      `;

      const div2 = L.DomUtil.create('div', 'legend', content);
      div2.innerHTML = `
        <h3>Legenda punti calcio e zoom</h3>
        <div class="legend-row"><span class="badge center-pn"></span>Centro Pordenone</div>
        <div class="legend-row"><span class="badge center-sd"></span>Centro San Donà di Piave</div>
        <div class="legend-row"><span class="badge overlap"></span>Città/zone nella sovrapposizione</div>
        <div class="legend-row"><span class="badge inside"></span>Zona interna principalmente a una delle due aree</div>
        <div class="legend-row"><span class="badge edge"></span>Zona limite</div>
        <div class="legend-row"><span class="badge football"></span>Comune/località con probabile campo o stadio da calcio</div>
        <div class="legend-row"><span class="badge outside"></span>Spesso oltre 1 ora</div>
        <div class="note">
          Punti progressivi: principali sempre visibili, zoom 9+ comuni importanti, zoom 10+ comuni medi, zoom 11+ dettagli, zoom 12+ frazioni/località.
        </div>
      `;

      L.DomEvent.disableClickPropagation(wrapper);
      L.DomEvent.disableScrollPropagation(wrapper);

      button.addEventListener('click', function(e) {
        e.preventDefault();
        wrapper.classList.toggle('open');
        button.innerHTML = wrapper.classList.contains('open') ? '× Chiudi legenda' : '☰ Legenda';
      });

      return wrapper;
    }
  });

  const Counter = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      const div = L.DomUtil.create('div', 'counter');
      div.id = 'zoomCounter';
      div.innerHTML = 'Zoom · punti visibili';
      return div;
    }
  });

  map.addControl(new CombinedLegend());
  map.addControl(new Counter());

  const allBounds = L.latLngBounds([...pordenone60, ...sanDona60]);
  map.fitBounds(allBounds, { padding: [30, 30] });
  updateZoomLayers();
